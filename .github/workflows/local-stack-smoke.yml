name: Local Docker stack smoke test

on:
  push:
    branches:
      - "20.0"
      - "alif/production-local"
    paths:
      - "Dockerfile"
      - "compose.yaml"
      - ".dockerignore"
      - ".env.example"
      - "docker/**"
      - "custom-addons/**"
      - "scripts/**"
      - ".github/workflows/local-stack-smoke.yml"
  pull_request:
    paths:
      - "Dockerfile"
      - "compose.yaml"
      - ".dockerignore"
      - ".env.example"
      - "docker/**"
      - "custom-addons/**"
      - "scripts/**"
      - ".github/workflows/local-stack-smoke.yml"
  workflow_dispatch:

concurrency:
  group: odoo-local-stack-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  local-compose:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      POSTGRES_PASSWORD: ci-postgres-admin-password-not-for-production
      ODOO_DB_USER: odoo
      ODOO_DB_PASSWORD: ci-odoo-app-password-not-for-production
      ODOO_MASTER_PASSWORD: ci-odoo-master-password-not-for-production
      ODOO_PORT: "8069"
      ODOO_GEVENT_PORT: "8072"
      ODOO_LOG_LEVEL: info

    steps:
      - name: Check out source
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Validate Compose configuration
        run: docker compose config --quiet

      - name: Build and start the local stack
        run: docker compose up --build -d

      - name: Wait for Odoo HTTP endpoint
        shell: bash
        run: |
          for attempt in $(seq 1 60); do
            if curl --fail --silent http://127.0.0.1:8069/web/login >/dev/null; then
              echo "Odoo HTTP endpoint is responding."
              exit 0
            fi
            sleep 5
          done
          docker compose ps
          docker compose logs --no-color
          exit 1

      - name: Tear down test services
        if: always()
        run: docker compose down --volumes --remove-orphans
